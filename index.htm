<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة الطالب - المعهد العالي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00c1;
            --tech-bg: #050a15;
            --glass-white: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--tech-bg);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .cyber-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #102040 0%, #050a15 100%);
        }

        .grid-line {
            position: absolute;
            background: var(--neon-blue);
            opacity: 0.1;
            animation: move-grid 10s linear infinite;
        }

        @keyframes move-grid {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .header-section {
            margin-top: 30px;
            text-align: center;
            animation: fadeInDown 0.8s ease-out;
        }

        .logos-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            padding: 8px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .title-text {
            color: gold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin: 10px 0;
            font-size: 1.4rem;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin-bottom: 100px;
        }

        .glass-card {
            background: var(--glass-white);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideUp 0.6s forwards;
            color: #1a2a44;
        }

        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .step-title {
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .opt-btn {
            background: #fff;
            border: 2px solid #eee;
            border-radius: 20px;
            padding: 20px 10px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .opt-btn:active { transform: scale(0.9); }
        .opt-btn.blue { border-bottom: 5px solid var(--neon-blue); }
        .opt-btn.pink { border-bottom: 5px solid var(--neon-pink); }
        .opt-btn i { font-size: 30px; margin-bottom: 10px; }

        .hidden { display: none; }
        select, .action-btn {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #ddd;
            margin-top: 15px;
            font-size: 1rem;
        }

        .action-btn {
            background: #1a2a44;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .schedule-row {
            background: #f8f9fa;
            border-right: 4px solid var(--neon-blue);
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            flex-direction: column; /* تغيير لتكون المواد تحت بعضها داخل نفس اليوم */
            gap: 5px;
        }

        .day-label {
            font-weight: bold;
            color: #1a2a44;
            border-bottom: 1px solid #eee;
            margin-bottom: 5px;
            display: block;
        }

        .mat-item {
            font-size: 0.95rem;
            color: #444;
        }

    </style>
</head>

let selectedMajor = "";

function setMajor(major) {
    selectedMajor = major;
    document.getElementById('major-display').innerText = `لقد اخترت: ${major}`;
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
}

function showSchedule() {
    const major = selectedMajor;
    const sem = document.getElementById('sem-select').value;
    let group = null;

    if(sem === "1") {
        group = prompt("اختر المجموعة (A أو B)");
        if(!group || !academicData[major][sem][group]) {
            alert("لا توجد بيانات لهذه المجموعة");
            return;
        }
    }

    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.remove('hidden');

    const scheduleDiv = document.getElementById('schedule-list');
    scheduleDiv.innerHTML = "";

    document.getElementById('schedule-title').innerText = (sem === "1") 
        ? `جدول ${major} - م(${group}) - سيمستر ${sem}` 
        : `جدول ${major} - سيمستر ${sem}`;

    const days = ["السبت","الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس"];

    days.forEach(day => {
        let items = [];
        if(sem === "1") {
            items = academicData[major][sem][group][day] || [];
        } else {
            items = (academicData[major][sem] && academicData[major][sem][day]) ? academicData[major][sem][day] : [];
        }

        if(items.length > 0) {
            // هنا التعديل: نضع اليوم مرة واحدة فقط ونضع تحته كل المواد
            let materialsHtml = items.map(mat => `<div class="mat-item">• ${mat}</div>`).join('');
            
            scheduleDiv.innerHTML += `
            <div class="schedule-row">
                <span class="day-label">${day}</span>
                ${materialsHtml}
            </div>`;
        }
    });
}
    </script>
